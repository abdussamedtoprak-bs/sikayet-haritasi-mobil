<div class="yan-menu" [class.acik]="menuAcik">

  <div class="menu-item" routerLink="/anasayfa">
    <i class="fa-solid fa-house"></i>
    <span>Ana Sayfa</span>
  </div>

  <div class="menu-item" routerLink="/bildirimler">
    <i class="fa-solid fa-bell"></i>
    <span>Bildirimler</span>
  </div>

  <!-- Yalnızca yönetici: tüm şikayetlerin yönetildiği sayfa -->
  @if (authService.isAdmin()) {
    <div class="menu-item" routerLink="/complaints">
      <i class="fa-solid fa-hourglass-end"></i>
      <span>Güncel Şikayetler</span>
    </div>
  }

  
     <!--
    Yalnızca öğrenci: kendi şikayetlerini görebileceği sayfa.
    Fatma'nın "Şikayetlerim" sayfası hazır olduğunda bu blok açılacak.-->

    @if (authService.isStudent()) {
      <div class="menu-item" routerLink="/user-complaints">
        <i class="fa-solid fa-list-check"></i>
        <span>Şikayetlerim</span>
      </div>
    }
  
  

  <div class="menu-item" routerLink="/destek">
    <i class="fa-solid fa-circle-info"></i>
    <span>Destek</span>
  </div>

  <div class="menu-item" routerLink="/ayarlar">
    <i class="fa-solid fa-gear"></i>
    <span>Ayarlar</span>
  </div>

  <div class="cikis" (click)="logout()" style="cursor: pointer;">
    <span>
      <i class="fa-solid fa-door-open"></i>
    </span>
  </div>

</div>
