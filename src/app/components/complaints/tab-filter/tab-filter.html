<div class="tab-filter-container">
    <!-- Eğer activeTab 'Tümü' ise 'active' class'ını ekle, değilse çıkar. Tıkladığımızda butonun renginin değişmesi için kullanılır -->
    <button class="tab-btn" [class.active]="activeTab==='Tümü'" (click)="onTabClick('Tümü')">Tümü ({{ counts.tumu }})</button>
    <button class="tab-btn" [class.active]="activeTab==='Acil'" (click)="onTabClick('Acil')">Acil ({{ counts.acil }})</button>
    <button class="tab-btn" [class.active]="activeTab==='Orta'" (click)="onTabClick('Orta')">Orta ({{ counts.orta }})</button>
    <button class="tab-btn" [class.active]="activeTab==='Düşük'" (click)="onTabClick('Düşük')">Düşük ({{ counts.dusuk }})</button>
</div>
