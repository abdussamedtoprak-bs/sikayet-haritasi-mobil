@if (isOpen) {
    <!-- Arka plan hafif karartan katman: Dışarı tıklanınca kapansın -->
    <div class="modal-overlay" (click)="close()">

        <!-- İç kutu: İçeri tıklanınca kapanmayı engelle -->
        <div class="modal-content" (click)="$event.stopPropagation()">

        <div class="modal-header">
            <h3 class="modal-title">Filtreleme</h3>
            <button class="close-btn" (click)="close()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            </button>
        </div>

        <!-- Orta Kısım: Sütunlar -->
        <div class="filter-columns">

            <!-- SOL TARAF (Kategori, Durum ve Butonları kapsar) -->
            <div class="left-section">
            
            <!-- Kategori ve Durum sütunları yan yana -->
            <div class="top-columns">
                
                <div class="filter-column">
                <h4 class="column-title">Kategori</h4>
                <label class="radio-option"><input type="radio" class="custom-radio radio-black" name="category" value="Tümü" [(ngModel)]="selectedCategory"> Tümü</label>
                <label class="radio-option"><input type="radio" class="custom-radio radio-red" name="category" value="Kritik" [(ngModel)]="selectedCategory"> Kritik</label>
                <label class="radio-option"><input type="radio" class="custom-radio radio-blue" name="category" value="Orta" [(ngModel)]="selectedCategory"> Orta</label>
                <label class="radio-option"><input type="radio" class="custom-radio radio-yellow" name="category" value="Düşük" [(ngModel)]="selectedCategory"> Düşük</label>
                </div>

                <div class="filter-column">
                <h4 class="column-title">Durum</h4>
                <label class="radio-option"><input type="radio" class="custom-radio radio-black" name="status" value="Tümü" [(ngModel)]="selectedStatus"> Tümü</label>
                <label class="radio-option"><input type="radio" class="custom-radio radio-gray" name="status" value="Beklemede" [(ngModel)]="selectedStatus"> Beklemede</label>
                <label class="radio-option"><input type="radio" class="custom-radio radio-orange" name="status" value="İnceleniyor" [(ngModel)]="selectedStatus"> İnceleniyor</label>
                <label class="radio-option"><input type="radio" class="custom-radio radio-green" name="status" value="Çözüldü" [(ngModel)]="selectedStatus"> Çözüldü</label>
                </div>
                
            </div>

            <!-- BUTONLAR (Sol tarafın altına yerleşir) -->
            <div class="modal-footer">
                <button class="btn-clear" (click)="close()">Temizle</button>
                <button class="btn-filter" (click)="onFilterClick()">Filtrele</button>
            </div>

            </div>

            <!-- SAĞ TARAF (Sadece Tarih sütunu) -->
            <div class="filter-column date-column">
            <h4 class="column-title">Tarih</h4>
            <label class="radio-option"><input type="radio" class="custom-radio radio-black" name="date" value="Tümü" [(ngModel)]="selectedDate"> Tümü</label>
            <label class="radio-option"><input type="radio" class="custom-radio radio-black" name="date" value="Bugün" [(ngModel)]="selectedDate"> Bugün</label>
            <label class="radio-option"><input type="radio" class="custom-radio radio-black" name="date" value="Son 7 gün" [(ngModel)]="selectedDate"> Son 7 gün</label>
            <label class="radio-option"><input type="radio" class="custom-radio radio-black" name="date" value="Son 30 gün" [(ngModel)]="selectedDate"> Son 30 gün</label>
            
            <!-- Özel Aralık ve Tarih Seçiciler -->
            <label class="radio-option custom-range-label">
                <input type="radio" class="custom-radio radio-black" name="date" value="Özel Aralık" [(ngModel)]="selectedDate"> Özel Aralık
            </label>
            
            
            <div class="date-pickers">
                <input type="date" value="2026-07-01">
                <input type="date" value="2026-07-20">
            </div>
            </div>

        </div>

        </div>
    </div>
}
