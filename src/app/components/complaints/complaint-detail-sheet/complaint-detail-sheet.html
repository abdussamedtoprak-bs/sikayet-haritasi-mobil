<div class="sheet-container" *ngIf="complaint">
    <!-- Üst Bar: navigasyon ve rozetler -->
    <div class="sheet-header"> 
        <!-- 1. Sol: Geri Butonu -->
        <div class="header-left">
            <button class="nav-btn" (click)="onPrev()">&lt;</button>
        </div>
        <!-- 2. Orta: Rozetler -->
        <div class="header-center badges">
            <!-- Dinamik öncelik verisi (Örn: Acil, Orta) -->
            <span class="badge priority-badge"
            [ngClass]="{
                'bg-acil': complaint?.priority === 'Acil',
                'bg-orta': complaint?.priority === 'Orta',
                'bg-dusuk': complaint?.priority === 'Düşük'
            }">{{ complaint?.priority }}</span>         
            <!-- Dinamik destek sayısı verisi -->
            <span class="badge upvote-badge">
            <i class="icon-user"></i> {{ complaint?.supportCount }}
            </span>
        </div>
        <!-- 3. Sağ: İleri ve Kapat Butonları -->
        <div class="header-right">
            <button class="nav-btn" (click)="onNext()">&gt;</button>
            <button class="close-btn" (click)="closeSheet()">X</button>
        </div>
    </div>
    <!-- İçerik alanı -->
    <div class="sheet-body">        
        <!-- Sol Kısım: Baret + Metinler -->
        <div class="info-section">
        <!-- Baret İkonu Alanı -->
        <div class="icon-wrapper">
            <!-- Figma'daki gibi kalın/dolu baret SVG'si -->
            <svg class="large-helmet-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a9 9 0 0 0-9 9v2h18v-2a9 9 0 0 0-9-9zm0 2c3.87 0 7 3.13 7 7H5c0-3.87 3.13-7 7-7z"/>
                <path d="M2 15h20v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-3z"/>
            </svg>
        </div>   
        <!-- Başlık, Açıklama ve Kategori (Dikey dizilim) -->
        <div class="text-content">
            <h3 class="title">{{complaint?.title}}</h3>
            <p class="description">
            {{complaint?.description}}
            </p>
            <!-- Kategori Kısmı -->
            <div class="category">
                <svg class="small-helmet-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2a9 9 0 0 0-9 9v2h18v-2a9 9 0 0 0-9-9zm0 2c3.87 0 7 3.13 7 7H5c0-3.87 3.13-7 7-7z"/>
                    <path d="M2 15h20v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-3z"/>
                </svg>
                <span>{{ complaint?.metaInfo ? complaint!.metaInfo.split('-')[0] : '' }}</span>
            </div>
        </div>
        </div>
        <!-- Sağ Kısım: Resim + Tarih -->
        <div class="media-section">
            <!-- Fotoğraf yalnızca varsa gösterilir -->
            @if (images().length > 0) {
                <img [src]="images()[0]" alt="Şikayet Fotoğrafı" class="complaint-image">
            }
            <!-- Tarih Kısmı -->
            <div class="date">
                <svg class="small-calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>{{ complaint?.metaInfo ? complaint!.metaInfo.split('-')[1] : '' }}</span>
            </div>
        </div> 
    </div>
</div>
