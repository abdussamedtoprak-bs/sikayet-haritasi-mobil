<div class="card-container"
        [class.border-red]="complaint.priority === 'Acil'"
        [class.border-blue]="complaint.priority === 'Orta'"
        [class.border-yellow]="complaint.priority === 'Düşük'">
    
    <div class="card-header">
        <h3 class="title">{{ complaint.title }}</h3>
        <!-- Destek Sayısı Rozeti -->
        <div class="support-badge"
            [class.bg-red]="complaint.priority === 'Acil'"
            [class.bg-blue]="complaint.priority === 'Orta'"
            [class.bg-yellow]="complaint.priority === 'Düşük'">
        👤 {{ complaint.supportCount }}
        </div>
    </div>

    <div class="card-body">
        <p class="description">{{ complaint.description }}</p>
    </div>

    <div class="card-footer">
        <span class="meta-info">{{ complaint.metaInfo }}</span>
        <!-- Durum Rozeti (Burası aynı kalıyor) -->
        <div class="status-badge"
            [class.status-review]="complaint.status === 'İnceleniyor'"
            [class.status-resolved]="complaint.status === 'Çözüldü'"
            [class.status-pending]="complaint.status === 'Beklemede'">
        {{ complaint.status }}
        </div>
    </div>


    <!-- Yalnızca Yöneticiye Gösterilecek Durum Güncelleme Alanı -->
    @if (currentUserRole === 'admin') {
        <div class="admin-actions" style="display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #e5e7eb; padding-top: 15px;">
            <button 
            (click)="durumGuncelle('İnceleniyor')" 
            style="flex: 1; padding: 8px; border-radius: 6px; border: none; background-color: #fbbf24; color: white; cursor: pointer; font-weight: bold;">
            İnceleniyor
            </button>
            <button 
            (click)="durumGuncelle('Çözüldü')" 
            style="flex: 1; padding: 8px; border-radius: 6px; border: none; background-color: #10b981; color: white; cursor: pointer; font-weight: bold;">
            Çözüldü
            </button>
        </div>
    }

</div>
