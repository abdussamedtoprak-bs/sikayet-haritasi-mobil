<header class="baslik" *ngIf="!showBackBtn">

    <div class="logo-alani">
        <img src="logo.png" alt="Logo">
        <span>Sikayet <br>&nbsp;&nbsp; Haritasi</span>
    </div>

    <div class="sag-alan">

            <div class="ikon-wrapper">
        <button class="ikon-butonu">
            <i class="fa-solid fa-circle-user"></i>
        </button>
        </div>

                <button class="ikon-butonu" (click)="menuAcik = !menuAcik">
        <i class="fa-solid fa-bars"></i>
        </button>

    </div>

</header>

<header class="baslik sub-header" *ngIf="showBackBtn">
    <button class="back-btn" (click)="goBack()">&#8592;</button>
    <h2 class="page-title">{{title}}</h2>
</header>

<app-yan-menu *ngIf="menuAcik"></app-yan-menu>
