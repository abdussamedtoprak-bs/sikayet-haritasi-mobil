<div class="profil-sayfasi">

  <div class="profil-baslik">
    <button class="geri-buton" (click)="geriDon()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h2>Profil</h2>
  </div>

  @if (authService.currentUser(); as user) {
    <div class="profil-karti">

      <div class="avatar-alani">
        @if (user.photoUrl) {
          <img [src]="user.photoUrl" alt="Profil Fotoğrafı" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
        } @else {
          <div class="avatar">{{ user.fullName ? user.fullName.charAt(0).toUpperCase() : '?' }}</div>
        }
        
        <button class="kamera-buton">
          <i class="fa-solid fa-camera"></i>
        </button>
      </div>

      <div class="profil-bilgileri">
        <h3>{{ user.fullName }}</h3>
        <p>{{ user.email }}</p>
        <button class="dogrulama-buton">
          <i class="fa-solid fa-circle-check"></i>
          {{ user.role === 'admin' ? 'Yönetici' : 'Öğrenci' }}
        </button>
      </div>

    </div>
  }

    <div class="istatistikler">

    <div class="istatistik-karti bildirim">
      <i class="fa-regular fa-clock"></i>
      <strong>{{ totalCount() }}</strong>
      <span>Bildirim</span>
    </div>

    <div class="istatistik-karti onaylanan">
      <i class="fa-regular fa-clock"></i>
      <strong>{{ resolvedCount() }}</strong>
      <span>Çözülen</span>
    </div>

    <div class="istatistik-karti bekleyen">
      <i class="fa-regular fa-clock"></i>
      <strong>{{ pendingCount() }}</strong>
      <span>Bekleyen</span>
    </div>

  </div>

  <div class="profil-menusu">

    <button class="menu-karti" (click)="kisiselBilgiler()">
      <div class="menu-ikon">
        <i class="fa-regular fa-user"></i>
      </div>
      <div class="menu-yazi">
        <strong>Kişisel Bilgiler</strong>
        <span>Ad, soyad, e-posta...</span>
      </div>
      <i class="fa-solid fa-chevron-right menu-ok"></i>
    </button>

  </div>

</div>
