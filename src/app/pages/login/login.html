<div class="login-wrapper">

  <div class="harita-bg"></div>

  <!-- Tekrar eden header kısmı template olarak tanımlandı -->
  <ng-template #authHeader let-baslik="baslik" let-aciklama="aciklama">
    <div class="logo-alan">
      <div class="logo-cerceve">
        <img src="/logo.png" alt="Logo" class="logo" />
      </div>
      <h1 class="uygulama-adi">{{ baslik }}</h1>
      <p class="uygulama-aciklama">{{ aciklama }}</p>
    </div>
  </ng-template>

  @if (!yoneticiModu) {
    <button class="geri-btn" disabled>←</button>

    <ng-container *ngTemplateOutlet="authHeader; context: {
      baslik: 'Şikayet Haritası',
      aciklama: 'Yaşadığın sorunları bildir, çözüm sürecini birlikte takip edelim.'
    }"></ng-container>

    <div class="giris-kart">
      <h2 class="kart-baslik">Hesabınıza giriş yapın</h2>
      <p class="kart-aciklama">Devam etmek için Outlook hesabınızı kullanın</p>

      <button class="outlook-btn" (click)="outlookGiris()">
        <span class="outlook-ikon">✉</span>
        Outlook ile giriş yapın
      </button>

      <div class="ayirac"><span></span></div>

      <button class="yonetici-btn" (click)="yoneticiGirisAc()">
        <span class="yonetici-ikon">🪪</span>
        Yönetici Girişi
        <span class="ok">›</span>
      </button>

      <p class="alt-metin">
        Hesabınız yok mu?
        <a routerLink="/register">Hemen Kayıt Olun</a>
      </p>
    </div>

  } @else {

    <button class="geri-btn" (click)="geri()">←</button>

    <ng-container *ngTemplateOutlet="authHeader; context: {
      baslik: 'Yönetici Girişi',
      aciklama: 'Yetkili hesabınızla giriş yapın'
    }"></ng-container>

    <div class="giris-kart">
      <h2 class="kart-baslik">Giriş bilgilerinizi girin</h2>

      <input
        class="form-input"
        type="email"
        placeholder="E-posta"
        [(ngModel)]="email"
      />

      <input
        class="form-input"
        type="password"
        placeholder="Şifre"
        [(ngModel)]="sifre"
      />

      @if (hataMesaji) {
        <p class="hata-mesaj">{{ hataMesaji }}</p>
      }

      <button class="outlook-btn" (click)="yoneticiGirisYap()">
        Giriş Yap
      </button>

      <p class="alt-metin test-bilgi">
        Test: personel@test.com / 123456
      </p>
    </div>
  }

</div>
