<div class="login-wrapper">

  <div class="harita-bg"></div>

  <!-- RouterModule sayesinde sayfa yenilenmeden login'e döner -->
  <button class="geri-btn" routerLink="/login">←</button>

  <div class="logo-alan">
    <div class="logo-cerceve">
      <img src="/logo.png" alt="Logo" class="logo" />
    </div>
    <h1 class="uygulama-adi">Kayıt Ol</h1>
    <p class="uygulama-aciklama">Bingöl Üniversitesi ağına katılın.</p>
  </div>

  <div class="giris-kart">
    <h2 class="kart-baslik">Hesap Oluşturun</h2>

    <input class="form-input" type="text" placeholder="Ad Soyad" [(ngModel)]="adSoyad" />
    
    <input class="form-input" type="email" placeholder="Öğrenci E-posta (@bingol.edu.tr)" [(ngModel)]="email" />
    
    <input class="form-input" type="password" placeholder="Şifre" [(ngModel)]="sifre" />
    
    <input class="form-input" type="password" placeholder="Şifre Tekrar" [(ngModel)]="sifreTekrar" />

    @if (hataMesaji) {
      <p class="hata-mesaj">{{ hataMesaji }}</p>
    }

    <!-- Tasarım bütünlüğü için outlook-btn sınıfını koruyoruz, ancak işlevi kayıt -->
    <button class="outlook-btn" style="background-color: #1a1a2e; color: white;" (click)="kayitOl()">
      Kayıt Ol
    </button>

    <p class="alt-metin">
      Zaten hesabınız var mı? <a routerLink="/login">Giriş Yap</a>
    </p>
  </div>
</div>
