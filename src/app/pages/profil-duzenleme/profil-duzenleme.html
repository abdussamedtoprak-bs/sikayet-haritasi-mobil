<div class="profil-duzenle-sayfasi">

  <div class="baslik-alani">
    <button class="geri-buton" (click)="goBack()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h2>Profil Düzenle</h2>
    </div>

  <div class="avatar-kapsayici">
    <div class="avatar-alani">
      @if (authService.currentUser()?.photoUrl) {
        <img
          [src]="authService.currentUser()!.photoUrl"
          class="avatar-resim"
          alt="Profil Fotoğrafı"
          referrerpolicy="no-referrer" />
      } @else {
        <div class="avatar">
          {{ fullName() ? fullName().charAt(0).toUpperCase() : '?' }}
        </div>
      }
    </div>
  </div>

  <div class="form-alani">

    <div class="form-elemani">
      <label>Ad Soyad</label>
      <input 
        type="text" 
        [ngModel]="fullName()" 
        (ngModelChange)="fullName.set($event)" 
        name="fullName" />
    </div>

    <div class="form-elemani">
      <label>E-posta</label>
      <input
        type="email"
        [value]="authService.currentUser()?.email"
        readonly
         />
    </div>

  </div>

  @if (errorMessage()) {
    <p class="hata-mesaji">
      {{ errorMessage() }}
    </p>
  }

  <button class="kaydet-alt-buton" (click)="save()" [disabled]="saving()">
    {{ saving() ? 'Kaydediliyor...' : 'Kaydet' }}
  </button>

</div>
