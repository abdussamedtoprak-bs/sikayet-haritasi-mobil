<div class="profil-duzenle-sayfasi">

  <div class="baslik-alani">
    <button class="geri-buton" (click)="geriDon()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h2>Profil Düzenle</h2>
    <button class="kaydet-ust-buton" (click)="kaydet()">Kaydet</button>
  </div>

  <div class="avatar-kapsayici">
    
    <input 
      type="file" 
      #fileInput
      (change)="fotografSec($event)" 
      accept="image/*" 
      style="display: none;">

    <div class="avatar-alani" (click)="fileInput.click()" style="cursor: pointer;">
      
      <ng-container *ngIf="secilenFotograf || kullanici.fotoUrl; else varsayilanAvatar">
        <img [src]="secilenFotograf || kullanici.fotoUrl" class="avatar-resim" alt="Profil Fotoğrafı">
      </ng-container>
      
      <ng-template #varsayilanAvatar>
        <div class="avatar">
          {{ kullanici.ad ? kullanici.ad.charAt(0).toUpperCase() : 'M' }}
        </div>
      </ng-template>

      <div class="kamera-buton" style="pointer-events: none;">
        <i class="fa-solid fa-camera"></i>
      </div>

    </div>

    <a href="javascript:void(0)" class="fotograf-degistir-link" (click)="fileInput.click()">Fotoğrafı Değiştir</a>
    
  </div>

  <div class="form-alani">
    
    <div class="form-elemani">
      <label>Ad</label>
      <input type="text" [(ngModel)]="kullanici.ad" name="ad">
    </div>

    <div class="form-elemani">
      <label>Soyad</label>
      <input type="text" [(ngModel)]="kullanici.soyad" name="soyad">
    </div>

    <div class="form-elemani">
      <label>E-posta</label>
      <input type="email" [(ngModel)]="kullanici.eposta" name="eposta" readonly style="color: #888;">
    </div>

    <div class="form-elemani ikonlu-input">
      <div class="input-icerik">
        <label>Doğum Tarihi</label>
        <input type="date" #tarihInput [(ngModel)]="kullanici.dogumTarihi" name="dogumTarihi">
      </div>
      <i class="fa-regular fa-calendar sag-ikon" style="cursor: pointer;" (click)="tarihInput.showPicker()"></i>
    </div>

    <div class="form-elemani ikonlu-input">
      <div class="input-icerik" style="width: 100%;">
        <label>Cinsiyet</label>
        <select [(ngModel)]="kullanici.cinsiyet" name="cinsiyet">
          <option value="Erkek">Erkek</option>
          <option value="Kadın">Kadın</option>
        </select>
      </div>
      <i class="fa-solid fa-chevron-down sag-ikon" style="position: absolute; right: 12px; bottom: 10px; pointer-events: none;"></i>
    </div>

  </div>

  <button class="kaydet-alt-buton" (click)="kaydet()">Kaydet</button>

</div>
