<div class="bildirimler-wrapper">

  <div class="header">
    <button class="geri-btn" (click)="geriDon()">←</button>
    <h1 class="baslik">Bildirimler</h1>
    <div class="header-avatar">M</div>
  </div>

  @if (okunmamisSayisi() > 0) {
    <div class="tumunu-oku-bar">
      <span>{{ okunmamisSayisi() }} okunmamış bildirim</span>
      <button class="tumunu-oku-btn" (click)="tumunuOku()">Tümünü Oku</button>
    </div>
  }

  <div class="bildirim-listesi">
    @for (bildirim of bildirimler(); track bildirim.id) {
      <app-notification-item
        [bildirim]="bildirim"
        (itemTiklandi)="bildirimeTikla($event)">
      </app-notification-item>
    }
  </div>

</div>
